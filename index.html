        <h1>Sander Riedberg</h1>
        <p>
          Regulatory Lead Software at Neko Health, previously Head of QA/RA
          at Platform24. Sander has worked in medical technology since 2016,
          across medical-device software, quality systems, hospital
          implementation and regulatory strategy.
        </p>
        <h2>Who</h2>
        <p>
          Sander works where product development meets regulatory strategy.
          By getting involved early, he helps teams clarify what they are
          building, establish a sound regulatory foundation and make informed
          trade-offs before they become costly.
        </p>
        <h2>In practice</h2>
        <p>
          His regulatory work begins alongside product development: clarifying
          the intended purpose, making trade-offs visible and giving teams
          clearer boundaries in which to build.
        </p>
        <h2>Experience</h2>
        <p>
          His earlier work includes QA/RA consulting at SymbioteQ and medical
          equipment implementation at Karolinska University Hospital through
          Semcon, including patient monitoring, infusion pumps and ventilator
          and anaesthesia systems.
        </p>
